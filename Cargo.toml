[package]
name = "ghbrief"
version = "0.1.2"
edition = "2021"
description = "Deterministic, template-driven summarizer for ghlinks report.json — no LLM required. A separate downstream tool; never a dependency of ghlinks itself."

[[bin]]
name = "ghbrief"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4" }
handlebars = "6"
toml = "0.8"

[profile.release]
opt-level = 2
